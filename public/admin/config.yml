backend:
  name: github
  repo: fwaaman/danewetton.com
  branch: main
  # TODO: replace with your Netlify auth-only site's URL once it's set up
  # (see README.md → "Setting up the CMS login").
  base_url: https://REPLACE-ME.netlify.app

# Requires manual approval before a change goes to `main` (adds a review step via
# GitHub PRs instead of committing straight to the live branch). Flip to false if
# you'd rather every save publish immediately.
publish_mode: simple

# Required as a fallback default; every field below overrides this with its own
# collection-specific media_folder/public_folder instead.
media_folder: "src/assets/uploads"
public_folder: "src/assets/uploads"

collections:
  - name: "gallery"
    label: "Portfolio Gallery"
    files:
      - name: "gallery"
        label: "Gallery"
        file: "src/content/gallery/gallery.json"
        fields:
          - label: "Images"
            name: "images"
            widget: "list"
            summary: "{{alt}}"
            fields:
              - { label: "ID", name: "id", widget: "string", hint: "Any unique value; controls sort order (lowest first)." }
              - { label: "Image", name: "image", widget: "image", media_folder: "../../assets/gallery", public_folder: "../../assets/gallery" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "journal"
    label: "Journal"
    folder: "src/content/journal"
    create: true
    slug: "{{slug}}"
    media_folder: "../../assets/journal"
    public_folder: "../../assets/journal"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Excerpt", name: "excerpt", widget: "text", pattern: ["^.{1,200}$", "Must be 200 characters or fewer"] }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Cover Image Alt Text", name: "coverAlt", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "home"
    label: "Home Page"
    files:
      - name: "home"
        label: "Hero"
        file: "src/content/home/home.json"
        fields:
          - { label: "Hero Image", name: "heroImage", widget: "image", required: false, media_folder: "../../assets/home", public_folder: "../../assets/home" }
          - { label: "Hero Image Alt Text", name: "heroAlt", widget: "string", required: false }

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About"
        file: "src/content/about/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Portrait", name: "portrait", widget: "image", required: false, media_folder: "../../assets/about", public_folder: "../../assets/about" }
          - { label: "Portrait Alt Text", name: "portraitAlt", widget: "string", required: false }
          - { label: "Bio", name: "body", widget: "markdown" }
